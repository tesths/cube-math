<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正方体三视图 · 教师端</title>
<meta name="description" content="一屏查看 10 个小组的正方体摆放情况。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="/config.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://registry.npmmirror.com/three/0.186.1/files/build/three.module.js",
    "three/addons/": "https://registry.npmmirror.com/three/0.186.1/files/examples/jsm/"
  }
}
</script>
<!-- 关键模块预加载：并行下载，消除 import 串行瀑布 -->
<link rel="preconnect" href="https://registry.npmmirror.com" crossorigin>
<link rel="dns-prefetch" href="//registry.npmmirror.com">
<link rel="modulepreload" href="https://registry.npmmirror.com/three/0.186.1/files/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://registry.npmmirror.com/three/0.186.1/files/build/three.core.js" crossorigin>
<link rel="modulepreload" href="https://registry.npmmirror.com/three/0.186.1/files/examples/jsm/controls/OrbitControls.js" crossorigin>
<link rel="modulepreload" href="/js/teacher/app.bundle.js">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
      <polygon points="16,3 28,10 16,17 4,10" fill="#f6e3cb"/>
      <polygon points="4,10 16,17 16,29 4,22" fill="#e8c9a4"/>
      <polygon points="28,10 16,17 16,29 28,22" fill="#cfa87b"/>
      <path d="M16 3 L28 10 L28 22 L16 29 L4 22 L4 10 Z M4 10 L16 17 L28 10 M16 17 L16 29"
            fill="none" stroke="#8c5a2b" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    正方体三视图
    <small>教师端 · 10 个小组</small>
  </div>

  <div class="spacer"></div>

  <div class="status" id="status" data-state="loading" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">连接中…</span>
  </div>
  <a class="btn btn-quiet" href="/settings">设置</a>
  <a class="btn btn-quiet" href="/">去学生端</a>
</header>

<main class="teacher-board" id="board" aria-label="10 个小组的摆放情况"></main>

<!-- 放大演示：点某个组的卡片进来，界面与学生端一致，方便投到大屏讲课 -->
<div class="focus-layer" id="focusLayer" hidden
     role="dialog" aria-modal="true" aria-labelledby="focusName">
  <header class="focus-bar">
    <div class="focus-title">
      <strong id="focusName">第 1 组</strong>
      <span class="focus-meta" id="focusMeta">0 块</span>
    </div>
    <div class="focus-actions">
      <span class="focus-hint">学生改了会实时同步</span>
      <button class="btn" id="focusClose" type="button">返回 10 个组</button>
    </div>
  </header>
  <div class="focus-body">
    <div class="focus-tools" id="focusTools">
      <p class="tool-step" id="focusToolStep">① 先点下面的按钮</p>
      <button class="btn btn-block action-btn" id="focusActionBtn" type="button" aria-pressed="false">移动木块</button>
      <button class="btn btn-block" id="focusResetBtn" type="button">重置木块</button>
      <p class="tool-tip" id="focusToolTip">先点「移动木块」按钮，才能点木块；点中一块再点目标格子就能挪过去，也可以直接拖动。</p>
    </div>
    <div class="focus-stage" id="focusStage">
      <canvas id="focusScene" aria-label="这一组摆放的立体图；先点左边的工具按钮才能操作木块"></canvas>
      <div class="stage-hint">
        <span class="chip guide-chip" id="focusGuideChip" aria-live="polite">① 先点左边「移动木块」按钮</span>
      </div>
      <div class="guide-toast" id="focusGuideToast" role="status" aria-live="assertive" hidden></div>
      <div class="stage-tools stage-tools--large">
        <button class="view-reset view-reset--large" id="focusReset" type="button" aria-label="复位视角">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"/>
            <path d="M3.5 4v4.6h4.6"/>
          </svg>
          <span>复位视角</span>
        </button>
        <button class="orbit-pad orbit-pad--large" id="focusOrbitPad" type="button"
                aria-label="按住拖动可以转视角">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
          <ellipse cx="24" cy="24" rx="8" ry="18" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".75"/>
          <path d="M6 24h36M9 14.5h30M9 33.5h30" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".75"/>
          <path d="M24 2.5v5M24 40.5v5M2.5 24h5M40.5 24h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
          <span>转视角</span>
        </button>
      </div>
    </div>
    <div class="focus-views" id="focusViews"></div>
  </div>
</div>

<script type="module" src="/js/teacher/app.bundle.js"></script>
</body>
</html>
